<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miklyxa Show — Статистика</title>
    <style>
        /* ===== ТЁМНЫЙ СТИЛЬ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #f0ecf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #12121e;
            border: 1px solid #1f1f35;
            border-radius: 28px;
            padding: 30px 34px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            transition: 0.3s;
        }

        .card:hover {
            border-color: #7c3aed;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: #2a2a3a;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #a0a0b0;
        }

        .badge.live {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 18px 0;
        }

        .stat {
            background: #1a1a2a;
            border-radius: 18px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid #2a2a3e;
            transition: 0.2s;
        }

        .stat:hover {
            border-color: #7c3aed;
            transform: scale(1.02);
        }

        .stat .number {
            font-size: 34px;
            font-weight: 700;
            color: #a855f7;
        }

        .stat .label {
            font-size: 13px;
            color: #8a8a9a;
            margin-top: 4px;
        }

        .stat .growth {
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
        }

        .stat .growth.positive { color: #34d399; }
        .stat .growth.negative { color: #f87171; }

        .connect-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 12px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .connect-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(124, 58, 237, 0.5);
        }

        .connect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #5a5a6a;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #1f1f35;
            padding-top: 16px;
        }

        .footer .refresh-btn {
            background: #2a2a3e;
            border: none;
            color: #c0c0d0;
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .footer .refresh-btn:hover {
            background: #7c3aed;
            color: #fff;
        }

        .error {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* ===== ТОКЕН ПОЛУЧЕН ===== */
        .token-status {
            text-align: center;
            margin: 12px 0 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .token-status .ok { color: #34d399; }
        .token-status .no { color: #f87171; }

        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .stat .number { font-size: 28px; }
            .stats { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ШАПКА -->
        <div class="header">
            <h1>🎮 Miklyxa Show</h1>
            <span class="badge" id="liveBadge">⏹ OFFLINE</span>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="stats">
            <div class="stat">
                <div class="number" id="followers">0</div>
                <div class="label">👥 Фолловеры</div>
                <div class="growth" id="followersGrowth">+0</div>
            </div>
            <div class="stat">
                <div class="number" id="viewers">0</div>
                <div class="label">👁️ Зрители</div>
                <div class="growth" id="viewersGrowth">+0</div>
            </div>
        </div>

        <!-- СТАТУС ТОКЕНА -->
        <div class="token-status" id="tokenStatus">
            <span class="no">🔴 Токен не получен</span>
        </div>

        <!-- КНОПКА ПОДКЛЮЧЕНИЯ -->
        <button class="connect-btn" id="connectBtn">🔗 Подключить Twitch</button>

        <!-- ФУТЕР -->
        <div class="footer">
            <span id="updateTime">—</span>
            <button class="refresh-btn" id="refreshBtn">⟳ Обновить</button>
        </div>

        <div class="error" id="errorMsg">Ошибка загрузки данных</div>
    </div>

    <script>
        // ============================================================
        //  КОНФИГУРАЦИЯ
        // ============================================================
        const CLIENT_ID = 'kimne78kx3ncx6brgo4mv6gki99h1na'; // публичный Client-ID Twitch
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const SCOPE = 'user:read:follows';

        // ============================================================
        //  РАБОТА С ТОКЕНОМ
        // ============================================================

        function getTokenFromURL() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                const token = params.get('access_token');
                if (token) {
                    localStorage.setItem('twitch_token', token);
                    window.location.hash = '';
                    return token;
                }
            }
            return localStorage.getItem('twitch_token');
        }

        function getToken() {
            return getTokenFromURL() || localStorage.getItem('twitch_token');
        }

        function setTokenStatus(hasToken) {
            const el = document.getElementById('tokenStatus');
            if (hasToken) {
                el.innerHTML = '<span class="ok">🟢 Токен получен — данные обновляются</span>';
            } else {
                el.innerHTML = '<span class="no">🔴 Токен не получен — нажмите "Подключить Twitch"</span>';
            }
        }

        // ============================================================
        //  ПОДКЛЮЧЕНИЕ К TWITCH
        // ============================================================

        document.getElementById('connectBtn').addEventListener('click', () => {
            const authUrl =
                `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${SCOPE}`;
            window.location.href = authUrl;
        });

        // ============================================================
        //  ЗАПРОС ДАННЫХ
        // ============================================================

        let prevFollowers = 0;
        let prevViewers = 0;

        async function fetchTwitchData() {
            const token = getToken();
            if (!token) {
                setTokenStatus(false);
                return null;
            }
            setTokenStatus(true);

            try {
                // 1. Получаем ID пользователя
                const userRes = await fetch('https://api.twitch.tv/helix/users?login=miklyxa_infa', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Client-ID': CLIENT_ID
                    }
                });
                if (!userRes.ok) throw new Error(`HTTP ${userRes.status}`);
                const userData = await userRes.json();
                const userId = userData.data?.[0]?.id;
                if (!userId) throw new Error('Пользователь не найден');

                // 2. Получаем фолловеров
                const followRes = await fetch(`https://api.twitch.tv/helix/users/follows?to_id=${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Client-ID': CLIENT_ID
                    }
                });
                if (!followRes.ok) throw new Error(`HTTP ${followRes.status}`);
                const followData = await followRes.json();
                const followers = followData.total || 0;

                // 3. Получаем зрителей (и статус стрима)
                const streamRes = await fetch('https://api.twitch.tv/helix/streams?user_login=miklyxa_infa', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Client-ID': CLIENT_ID
                    }
                });
                if (!streamRes.ok) throw new Error(`HTTP ${streamRes.status}`);
                const streamData = await streamRes.json();
                const stream = streamData.data?.[0];
                const viewers = stream ? stream.viewer_count : 0;
                const isLive = !!stream;
                const game = stream ? stream.game_name : 'Не в эфире';

                return { followers, viewers, isLive, game };

            } catch (e) {
                console.error('❌ Ошибка:', e);
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = `Ошибка: ${e.message}`;
                return null;
            }
        }

        // ============================================================
        //  ОТОБРАЖЕНИЕ
        // ============================================================

        function updateUI(data) {
            if (!data) return;

            const { followers, viewers, isLive, game } = data;

            // Фолловеры
            const fEl = document.getElementById('followers');
            const fGrowth = document.getElementById('followersGrowth');
            if (fEl) {
                fEl.textContent = followers.toLocaleString('ru-RU');
                const diff = followers - prevFollowers;
                if (diff > 0) {
                    fGrowth.textContent = `↑ +${diff}`;
                    fGrowth.className = 'growth positive';
                } else if (diff < 0) {
                    fGrowth.textContent = `↓ ${diff}`;
                    fGrowth.className = 'growth negative';
                } else {
                    fGrowth.textContent = '→ 0';
                    fGrowth.className = 'growth';
                }
                prevFollowers = followers;
            }

            // Зрители
            const vEl = document.getElementById('viewers');
            const vGrowth = document.getElementById('viewersGrowth');
            if (vEl) {
                vEl.textContent = viewers.toLocaleString('ru-RU');
                const diff = viewers - prevViewers;
                if (diff > 0) {
                    vGrowth.textContent = `↑ +${diff}`;
                    vGrowth.className = 'growth positive';
                } else if (diff < 0) {
                    vGrowth.textContent = `↓ ${diff}`;
                    vGrowth.className = 'growth negative';
                } else {
                    vGrowth.textContent = '→ 0';
                    vGrowth.className = 'growth';
                }
                prevViewers = viewers;
            }

            // LIVE-бейдж
            const badge = document.getElementById('liveBadge');
            if (isLive) {
                badge.textContent = '🔴 LIVE';
                badge.className = 'badge live';
            } else {
                badge.textContent = '⏹ OFFLINE';
                badge.className = 'badge';
            }

            // Время
            const now = new Date();
            document.getElementById('updateTime').textContent =
                now.getHours().toString().padStart(2, '0') + ':' +
                now.getMinutes().toString().padStart(2, '0') + ':' +
                now.getSeconds().toString().padStart(2, '0');

            // Скрываем ошибку
            document.getElementById('errorMsg').style.display = 'none';
        }

        // ============================================================
        //  ОБНОВЛЕНИЕ
        // ============================================================

        async function refresh() {
            const btn = document.getElementById('refreshBtn');
            btn.textContent = '⟳ ...';
            btn.disabled = true;

            const data = await fetchTwitchData();
            if (data) {
                updateUI(data);
            }

            btn.textContent = '⟳ Обновить';
            btn.disabled = false;
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        // Проверяем токен в URL при загрузке
        getTokenFromURL();

        // Если токен есть — запускаем обновление
        if (getToken()) {
            setTokenStatus(true);
            refresh();
            setInterval(refresh, 3000);
        } else {
            setTokenStatus(false);
        }

        document.getElementById('refreshBtn').addEventListener('click', refresh);
    </script>

</body>
</html>
