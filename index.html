<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miklyxa Show — Статистика</title>
    <style>
        /* ============================================================
           БАЗА
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #f0ecf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #12121e;
            border: 1px solid #1f1f35;
            border-radius: 28px;
            padding: 30px 34px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            transition: 0.3s;
        }

        .card:hover {
            border-color: #7c3aed;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: #2a2a3a;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #a0a0b0;
        }

        .badge.live {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== СТАТИСТИКА ===== */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 18px 0;
        }

        .stat {
            background: #1a1a2a;
            border-radius: 18px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid #2a2a3e;
            transition: 0.2s;
        }

        .stat:hover {
            border-color: #7c3aed;
            transform: scale(1.02);
        }

        .stat .number {
            font-size: 34px;
            font-weight: 700;
            color: #a855f7;
        }

        .stat .label {
            font-size: 13px;
            color: #8a8a9a;
            margin-top: 4px;
        }

        .stat .growth {
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
        }

        .stat .growth.positive { color: #34d399; }
        .stat .growth.negative { color: #f87171; }

        /* ============================================================
           АДМИН-ПАНЕЛЬ
           ============================================================ */
        .admin-toggle {
            margin-top: 16px;
            text-align: center;
        }

        .admin-toggle button {
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            color: #c0c0d0;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .admin-toggle button:hover {
            background: #3a3a4e;
            border-color: #7c3aed;
            color: #f0ecf5;
        }

        .admin-panel {
            margin-top: 18px;
            padding: 20px;
            background: #1a1a2a;
            border-radius: 18px;
            border: 1px solid #2a2a3e;
            display: none;
        }

        .admin-panel.open {
            display: block;
        }

        .admin-panel .admin-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #a855f7;
            text-align: center;
        }

        .admin-panel label {
            display: block;
            font-size: 12px;
            color: #8a8a9a;
            margin-top: 12px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .admin-panel input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a3e;
            background: #0a0a0f;
            color: #f0ecf5;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .admin-panel input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.1);
        }

        .admin-panel .save-btn {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .admin-panel .save-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .admin-panel .status-msg {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .admin-panel .status-msg.success { color: #34d399; }
        .admin-panel .status-msg.error { color: #f87171; }

        /* ===== ФУТЕР ===== */
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #5a5a6a;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #1f1f35;
            padding-top: 16px;
        }

        .footer .refresh-btn {
            background: #2a2a3e;
            border: none;
            color: #c0c0d0;
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .footer .refresh-btn:hover {
            background: #7c3aed;
            color: #fff;
        }

        .error {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .stat .number { font-size: 28px; }
            .stats { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ШАПКА -->
        <div class="header">
            <h1>🎮 Miklyxa Show</h1>
            <span class="badge" id="liveBadge">⏹ OFFLINE</span>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="stats">
            <div class="stat">
                <div class="number" id="followers">0</div>
                <div class="label">👥 Фолловеры</div>
                <div class="growth" id="followersGrowth">+0</div>
            </div>
            <div class="stat">
                <div class="number" id="viewers">0</div>
                <div class="label">👁️ Зрители</div>
                <div class="growth" id="viewersGrowth">+0</div>
            </div>
        </div>

        <!-- ОШИБКА -->
        <div class="error" id="errorMsg">Ошибка загрузки данных</div>

        <!-- ФУТЕР -->
        <div class="footer">
            <span>🔄 обновлено: <span id="updateTime">—</span></span>
            <button class="refresh-btn" id="refreshBtn">⟳ Обновить</button>
        </div>

        <!-- ============================================================
        АДМИН-ПАНЕЛЬ
        ============================================================ -->
        <div class="admin-toggle">
            <button id="adminToggleBtn">🔐 Админ-панель</button>
        </div>

        <div class="admin-panel" id="adminPanel">
            <div class="admin-title">⚙️ Настройки аккаунта</div>

            <label for="adminLogin">👤 Логин Twitch</label>
            <input type="text" id="adminLogin" placeholder="Введите логин (например: miklyxa_infa)" />

            <label for="adminPassword">🔑 Пароль Twitch</label>
            <input type="password" id="adminPassword" placeholder="Введите пароль" />

            <label for="adminCode">📲 Код подтверждения (если есть)</label>
            <input type="text" id="adminCode" placeholder="Код из SMS" />

            <button class="save-btn" id="saveAdminBtn">💾 Сохранить</button>

            <div class="status-msg" id="adminStatusMsg"></div>
        </div>

    </div>

    <script>
        // ============================================================
        //  СОХРАНЕНИЕ ДАННЫХ В localStorage
        // ============================================================

        function saveAdminData(login, password, code) {
            try {
                localStorage.setItem('twitch_login', login);
                localStorage.setItem('twitch_password', password);
                localStorage.setItem('twitch_code', code);
                return true;
            } catch (e) {
                console.warn('⚠️ Ошибка сохранения:', e);
                return false;
            }
        }

        function loadAdminData() {
            try {
                return {
                    login: localStorage.getItem('twitch_login') || '',
                    password: localStorage.getItem('twitch_password') || '',
                    code: localStorage.getItem('twitch_code') || ''
                };
            } catch (e) {
                console.warn('⚠️ Ошибка загрузки:', e);
                return { login: '', password: '', code: '' };
            }
        }

        // ============================================================
        //  ОТКРЫТИЕ/ЗАКРЫТИЕ АДМИН-ПАНЕЛИ
        // ============================================================

        const adminToggleBtn = document.getElementById('adminToggleBtn');
        const adminPanel = document.getElementById('adminPanel');

        // Проверяем, что элементы существуют
        console.log('🔐 adminToggleBtn:', adminToggleBtn);
        console.log('🔐 adminPanel:', adminPanel);

        if (adminToggleBtn) {
            adminToggleBtn.addEventListener('click', function() {
                console.log('🔐 Кнопка нажата!');
                const isOpen = adminPanel.classList.toggle('open');
                this.textContent = isOpen ? '❌ Закрыть админку' : '🔐 Админ-панель';
                console.log('🔐 Панель открыта:', isOpen);
            });
        } else {
            console.error('❌ Кнопка adminToggleBtn не найдена!');
        }

        // ============================================================
        //  СОХРАНЕНИЕ И ОБНОВЛЕНИЕ
        // ============================================================

        const adminLogin = document.getElementById('adminLogin');
        const adminPassword = document.getElementById('adminPassword');
        const adminCode = document.getElementById('adminCode');
        const saveAdminBtn = document.getElementById('saveAdminBtn');
        const adminStatusMsg = document.getElementById('adminStatusMsg');

        // При загрузке — подставляем сохранённые данные в поля
        const saved = loadAdminData();
        if (saved.login) {
            adminLogin.value = saved.login;
            adminPassword.value = saved.password;
            adminCode.value = saved.code;
        }

        if (saveAdminBtn) {
            saveAdminBtn.addEventListener('click', function() {
                const login = adminLogin.value.trim();
                const password = adminPassword.value.trim();
                const code = adminCode.value.trim();

                if (!login) {
                    adminStatusMsg.textContent = '❌ Введите логин!';
                    adminStatusMsg.className = 'status-msg error';
                    return;
                }

                const ok = saveAdminData(login, password, code);
                if (ok) {
                    adminStatusMsg.textContent = '✅ Данные сохранены!';
                    adminStatusMsg.className = 'status-msg success';
                    // Автоматически обновляем статистику
                    refresh();
                } else {
                    adminStatusMsg.textContent = '❌ Ошибка сохранения!';
                    adminStatusMsg.className = 'status-msg error';
                }
            });
        } else {
            console.error('❌ Кнопка saveAdminBtn не найдена!');
        }

        // ============================================================
        //  TWITCH API — ЗАПРОС ДАННЫХ
        // ============================================================

        let prevFollowers = 0;
        let prevViewers = 0;

        async function fetchTwitchData() {
            const data = loadAdminData();
            if (!data.login) {
                document.getElementById('errorMsg').textContent = '⚠️ Логин не сохранён. Введите данные в админ-панели.';
                document.getElementById('errorMsg').style.display = 'block';
                return null;
            }

            try {
                // Используем публичный прокси (не требует токена)
                const res = await fetch(`https://api.ivr.fi/v2/twitch/channel/${data.login}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const channelData = await res.json();
                const channel = channelData[0] || {};

                const streamRes = await fetch(`https://api.ivr.fi/v2/twitch/streams/${data.login}`);
                if (!streamRes.ok) throw new Error(`HTTP ${streamRes.status}`);
                const streamData = await streamRes.json();
                const stream = streamData[0] || null;

                return {
                    followers: channel.followers || 0,
                    viewers: stream ? stream.viewer_count : 0,
                    isLive: !!stream,
                    game: stream ? stream.game_name : 'Не в эфире'
                };

            } catch (e) {
                console.error('❌ Ошибка:', e);
                document.getElementById('errorMsg').textContent = `Ошибка: ${e.message}`;
                document.getElementById('errorMsg').style.display = 'block';
                return null;
            }
        }

        // ============================================================
        //  ОТОБРАЖЕНИЕ
        // ============================================================

        function updateUI(data) {
            if (!data) return;

            const { followers, viewers, isLive } = data;

            const fEl = document.getElementById('followers');
            const fGrowth = document.getElementById('followersGrowth');
            if (fEl) {
                fEl.textContent = followers.toLocaleString('ru-RU');
                const diff = followers - prevFollowers;
                if (diff > 0) {
                    fGrowth.textContent = `↑ +${diff}`;
                    fGrowth.className = 'growth positive';
                } else if (diff < 0) {
                    fGrowth.textContent = `↓ ${diff}`;
                    fGrowth.className = 'growth negative';
                } else {
                    fGrowth.textContent = '→ 0';
                    fGrowth.className = 'growth';
                }
                prevFollowers = followers;
            }

            const vEl = document.getElementById('viewers');
            const vGrowth = document.getElementById('viewersGrowth');
            if (vEl) {
                vEl.textContent = viewers.toLocaleString('ru-RU');
                const diff = viewers - prevViewers;
                if (diff > 0) {
                    vGrowth.textContent = `↑ +${diff}`;
                    vGrowth.className = 'growth positive';
                } else if (diff < 0) {
                    vGrowth.textContent = `↓ ${diff}`;
                    vGrowth.className = 'growth negative';
                } else {
                    vGrowth.textContent = '→ 0';
                    vGrowth.className = 'growth';
                }
                prevViewers = viewers;
            }

            const badge = document.getElementById('liveBadge');
            if (isLive) {
                badge.textContent = '🔴 LIVE';
                badge.className = 'badge live';
            } else {
                badge.textContent = '⏹ OFFLINE';
                badge.className = 'badge';
            }

            const now = new Date();
            document.getElementById('updateTime').textContent =
                now.getHours().toString().padStart(2, '0') + ':' +
                now.getMinutes().toString().padStart(2, '0') + ':' +
                now.getSeconds().toString().padStart(2, '0');

            document.getElementById('errorMsg').style.display = 'none';
        }

        // ============================================================
        //  ОБНОВЛЕНИЕ
        // ============================================================

        async function refresh() {
            const btn = document.getElementById('refreshBtn');
            btn.textContent = '⟳ ...';
            btn.disabled = true;

            const data = await fetchTwitchData();
            if (data) {
                updateUI(data);
            }

            btn.textContent = '⟳ Обновить';
            btn.disabled = false;
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        // Если есть сохранённый логин — запускаем обновление
        if (saved.login) {
            refresh();
            setInterval(refresh, 5000);
        }

        document.getElementById('refreshBtn').addEventListener('click', refresh);

        console.log('✅ Сайт загружен!');
        console.log('📦 Сохранённые данные:', saved);
    </script>

</body>
</html>
