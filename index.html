<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miklyxa Show — Статистика</title>
    <style>
        /* ============================================================
           TWITCH СТИЛЬ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #f0ecf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #12121e;
            border: 1px solid #1f1f35;
            border-radius: 28px;
            padding: 30px 34px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            transition: 0.3s;
        }

        .card:hover {
            border-color: #7c3aed;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: #2a2a3a;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #a0a0b0;
        }

        .badge.live {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 18px 0;
        }

        .stat {
            background: #1a1a2a;
            border-radius: 18px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid #2a2a3e;
            transition: 0.2s;
        }

        .stat:hover {
            border-color: #7c3aed;
            transform: scale(1.02);
        }

        .stat .number {
            font-size: 34px;
            font-weight: 700;
            color: #a855f7;
        }

        .stat .label {
            font-size: 13px;
            color: #8a8a9a;
            margin-top: 4px;
        }

        .stat .growth {
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
        }

        .stat .growth.positive { color: #34d399; }
        .stat .growth.negative { color: #f87171; }

        /* ============================================================
           АДМИН-ПАНЕЛЬ
           ============================================================ */
        .admin-toggle {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            border: 1px solid #2a2a3e;
            border-radius: 14px;
            background: transparent;
            color: #8a8a9a;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .admin-toggle:hover {
            border-color: #7c3aed;
            color: #f0ecf5;
        }

        .admin-panel {
            margin-top: 16px;
            padding: 20px;
            background: #1a1a2a;
            border-radius: 18px;
            border: 1px solid #2a2a3e;
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel .admin-title {
            font-size: 14px;
            font-weight: 700;
            color: #a855f7;
            margin-bottom: 14px;
            text-align: center;
        }

        .admin-panel .input-group {
            margin-bottom: 12px;
        }

        .admin-panel label {
            display: block;
            font-size: 12px;
            color: #8a8a9a;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .admin-panel input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a3e;
            background: #0a0a0f;
            color: #f0ecf5;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .admin-panel input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
        }

        .admin-panel .save-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            margin-top: 6px;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .admin-panel .save-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(124, 58, 237, 0.5);
        }

        .admin-panel .status-msg {
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            border-radius: 10px;
            display: none;
        }

        .admin-panel .status-msg.success {
            display: block;
            background: rgba(52, 211, 153, 0.1);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .admin-panel .status-msg.error {
            display: block;
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        /* ============================================================
           ДРУГОЕ
           ============================================================ */
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #5a5a6a;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #1f1f35;
            padding-top: 16px;
        }

        .footer .refresh-btn {
            background: #2a2a3e;
            border: none;
            color: #c0c0d0;
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .footer .refresh-btn:hover {
            background: #7c3aed;
            color: #fff;
        }

        .error {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .info-text {
            font-size: 11px;
            color: #5a5a6a;
            text-align: center;
            margin-top: 12px;
            border-top: 1px solid #1f1f35;
            padding-top: 12px;
        }

        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .stat .number { font-size: 28px; }
            .stats { gap: 10px; }
        }
    </style>
</head>

        </div>
    </div>
